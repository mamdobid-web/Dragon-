<title>Dragon bka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
/* Layout: one-screen phone game — resource bar on top, one scrolling view, tab bar fixed at the bottom; single twilight-archipelago look */
:root{
  --sky:#171a33;        /* night sea behind everything */
  --reef:#22284a;       /* panels */
  --reef-2:#2c3360;     /* raised panels */
  --foam:#f4ead6;       /* text */
  --mist:#aeb0cf;       /* secondary text */
  --ember:#ff8a3d;      /* main action */
  --gold:#ffcf4a;
  --gem:#62e3d3;
  --leaf:#7bd88f;
  --danger:#ff6b6b;
  --line:rgba(244,234,214,.10);
  --font-display:'Lalezar','Tajawal',system-ui,sans-serif;
  --font-body:'Tajawal',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r:18px;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--sky);
  background-image:radial-gradient(120% 60% at 50% -10%, #3b2f5c 0%, transparent 60%),
                   radial-gradient(80% 40% at 50% 110%, #123a4a 0%, transparent 70%);
  background-attachment:fixed;
  color:var(--foam);font-family:var(--font-body);font-size:16px;line-height:1.5;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sky)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gem);outline-offset:2px;border-radius:10px}
#app{
  max-width:560px;margin:0 auto;min-height:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(92px + env(safe-area-inset-bottom,0px));
}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:12px 10px;background:linear-gradient(var(--sky) 75%,transparent)}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.brand img{width:44px;height:44px;border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.brand h1{font-family:var(--font-display);font-weight:400;font-size:30px;line-height:1;margin:0;letter-spacing:.5px;direction:ltr}
.brand h1 span{color:var(--ember)}
.res{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--reef);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px;min-width:0}
.chip b{font-variant-numeric:tabular-nums;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip small{color:var(--mist);font-size:12px;margin-inline-start:auto}
.ico{width:22px;height:22px;flex:none}

/* views */
.view{display:flex;flex-direction:column;gap:14px;padding-top:6px}
.vh{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.vh h2{font-family:var(--font-display);font-weight:400;font-size:26px;margin:0;line-height:1.2;text-wrap:balance}
.vh p{margin:0;color:var(--mist);font-size:14px}
.hint{color:var(--mist);font-size:14px;margin:0}

.card{background:var(--reef);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.hab{background:linear-gradient(160deg,var(--h1) 0%,var(--reef) 55%)}
.hab-head{display:flex;align-items:center;gap:10px}
.hab-head h3{margin:0;font-family:var(--font-display);font-weight:400;font-size:22px;line-height:1.1}
.hab-head .cap{color:var(--mist);font-size:13px}
.hab-head .grow{flex:1;min-width:0}
.store{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.22);border-radius:12px;padding:8px 10px}
.bar{flex:1;height:8px;background:rgba(255,255,255,.08);border-radius:99px;overflow:hidden;min-width:40px}
.bar i{display:block;height:100%;width:0;background:var(--gold);border-radius:99px;transition:width .4s}
.bar.food i{background:var(--leaf)} .bar.gem i{background:var(--gem)} .bar.ember i{background:var(--ember)}
.store b{font-variant-numeric:tabular-nums;min-width:4ch}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:12px;font-weight:800;font-size:15px;background:var(--ember);color:#2a1406;box-shadow:0 3px 0 #b8541c;transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b8541c}
.btn.ghost{background:var(--reef-2);color:var(--foam);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.btn.gem{background:var(--gem);color:#06302b;box-shadow:0 3px 0 #2a9c8f}
.btn.gold{background:var(--gold);color:#3a2a00;box-shadow:0 3px 0 #b38d1d}
.btn.small{padding:7px 12px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.danger{background:var(--danger);color:#3a0909;box-shadow:0 3px 0 #a33}

.dragons{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.dtile{background:rgba(0,0,0,.2);border-radius:14px;padding:6px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid transparent}
.dtile:hover{border-color:var(--line)}
.dtile canvas{width:100%;aspect-ratio:5/4;max-width:100%}
.dtile .nm{font-weight:800;font-size:15px}
.dtile .lv{color:var(--mist);font-size:12px}
.slot-empty{border:2px dashed var(--line);border-radius:14px;display:grid;place-items:center;color:var(--mist);font-size:13px;min-height:120px;text-align:center;padding:8px}

.els{display:flex;gap:4px;flex-wrap:wrap}
.el{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--c);color:#14182b}

.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.egg-card{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.egg-card canvas{width:96px;height:112px}
.egg-card .nm{font-weight:800}
.price{display:inline-flex;align-items:center;gap:4px;font-variant-numeric:tabular-nums}
.price .ico{width:16px;height:16px}

.inc{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.incslot{background:rgba(0,0,0,.22);border-radius:14px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;min-height:190px;justify-content:center;text-align:center}
.incslot canvas{width:90px;height:105px}
.tm{font-variant-numeric:tabular-nums;color:var(--mist);font-size:13px}

.pick{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.pickbox{background:rgba(0,0,0,.22);border-radius:14px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px;text-align:center;border:2px dashed var(--line)}
.pickbox.on{border-style:solid;border-color:var(--ember)}
.pickbox canvas{width:100%;max-width:140px;aspect-ratio:5/4}
.plus{font-family:var(--font-display);font-size:30px;color:var(--ember)}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.18);border-radius:12px;padding:6px 10px;text-align:start;width:100%;border:2px solid transparent}
.li.sel{border-color:var(--ember)}
.li canvas{width:64px;height:51px;flex:none}
.li .t{flex:1;min-width:0}
.li .t b{display:block}
.li .t small{color:var(--mist)}
.li.locked{opacity:.5}

.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.dexc{background:var(--reef);border:1px solid var(--line);border-radius:14px;padding:8px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.dexc canvas{width:100%;aspect-ratio:5/4}
.dexc .how{color:var(--mist);font-size:12px}
.dexc.legend{background:linear-gradient(160deg,#4a3a1a,var(--reef) 60%)}

.light{background:radial-gradient(120% 120% at 50% 0%,#5a4a1d 0%,var(--reef) 60%);text-align:center;align-items:center}
.light h3{font-family:var(--font-display);font-weight:400;font-size:34px;margin:0;color:var(--gold)}
.light p{margin:0;color:var(--mist)}
.light .btn{font-size:18px;padding:14px 26px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.setrow p{margin:0}
.setrow small{color:var(--mist);display:block}
.switch{width:52px;height:30px;border-radius:99px;background:var(--reef-2);position:relative;flex:none}
.switch::after{content:"";position:absolute;top:4px;inset-inline-start:4px;width:22px;height:22px;border-radius:50%;background:var(--mist);transition:.2s}
.switch[aria-checked="true"]{background:var(--leaf)}
.switch[aria-checked="true"]::after{inset-inline-start:26px;background:#fff}

/* tab bar */
.tabs{position:fixed;inset:auto 0 0;z-index:6;background:rgba(23,26,51,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px))}
.tabs nav{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 10px;color:var(--mist);font-size:12px;font-weight:700;position:relative}
.tab svg{width:26px;height:26px}
.tab[aria-current="page"]{color:var(--ember)}
.tab .dot{position:absolute;top:6px;inset-inline-end:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--danger)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(5,6,15,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--reef);width:100%;max-width:560px;border-radius:24px 24px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;max-height:88%;overflow:auto;animation:up .22s ease-out}
.sheet h3{font-family:var(--font-display);font-weight:400;font-size:28px;margin:0}
.sheet canvas.big{width:100%;max-width:300px;aspect-ratio:5/4;align-self:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:rgba(0,0,0,.2);border-radius:12px;padding:8px;text-align:center}
.stat small{display:block;color:var(--mist);font-size:12px}
.stat b{font-variant-numeric:tabular-nums;font-size:18px}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:30;background:var(--foam);color:var(--sky);font-weight:800;padding:10px 18px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px);text-align:center;animation:up .2s}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.15)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

let ac=null;
function tone(f,d=.12,type='triangle',v=.08,delay=0){
  if(!state.sound)return;
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const t=ac.currentTime+delay;const o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d+.02)}catch(e){}
}

/* ---------- drawing ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
  const f=amt<0?0:255,p=Math.abs(amt);r=Math.round((f-r)*p+r);g=Math.round((f-g)*p+g);b=Math.round((f-b)*p+b);return `rgb(${r},${g},${b})`}
function feature(ctx,el,x,y,s,t,ang){ // small element ornament at (x,y)
  ctx.save();ctx.translate(x,y);ctx.rotate(ang||0);ctx.scale(s,s);
  if(el==='fire'){const f=1+Math.sin(t*9)*.12;ctx.fillStyle='#ffb347';ctx.beginPath();ctx.moveTo(0,-14*f);ctx.quadraticCurveTo(9,-2,0,6);ctx.quadraticCurveTo(-9,-2,0,-14*f);ctx.fill();
    ctx.fillStyle='#ff5a2a';ctx.beginPath();ctx.moveTo(0,-8*f);ctx.quadraticCurveTo(5,-1,0,4);ctx.quadraticCurveTo(-5,-1,0,-8*f);ctx.fill();}
  else if(el==='water'){ctx.fillStyle='#8fe3ff';ctx.beginPath();ctx.moveTo(0,0);for(let i=0;i<=4;i++){const a=-1.2+i*.6;ctx.lineTo(Math.cos(a)*13,Math.sin(a)*13-4)}ctx.closePath();ctx.fill();
    ctx.strokeStyle='#2f8fd8';ctx.lineWidth=1.2;for(let i=0;i<=4;i++){const a=-1.2+i*.6;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*12,Math.sin(a)*12-4);ctx.stroke()}}
  else if(el==='rock'){ctx.fillStyle='#e0c49a';ctx.strokeStyle='#4a3727';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-6,2);ctx.lineTo(0,-13);ctx.lineTo(6,2);ctx.closePath();ctx.fill();ctx.stroke();}
  else if(el==='wind'){ctx.strokeStyle='#f1f6ff';ctx.lineWidth=3;ctx.lineCap='round';for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(i*6,-8,i*9+Math.sin(t*4+i)*2,-15);ctx.stroke()}}
  else if(el==='bloom'){for(let i=0;i<5;i++){ctx.fillStyle='#ff8fc8';const a=i/5*Math.PI*2+t*.5;ctx.beginPath();ctx.ellipse(Math.cos(a)*5,Math.sin(a)*5-6,4.5,3,a,0,7);ctx.fill()}ctx.fillStyle='#ffe066';ctx.beginPath();ctx.arc(0,-6,3,0,7);ctx.fill();}
  ctx.restore();
}
function drawDragon(ctx,sp,t,W,H,opt={}){
  const s=S[sp];ctx.clearRect(0,0,W,H);ctx.save();
  const k=Math.min(W/200,H/160);ctx.translate(W/2,H/2+8*k);ctx.scale(k,k);ctx.scale(-1,1); // face toward reading start (RTL)
  const sil=opt.sil;const C=c=>sil?'#2a2f55':c;
  const bob=Math.sin(t*2.2)*3, flap=Math.sin(t*5)*.35, blink=(t%4)<.12;
  // shadow
  ctx.fillStyle='rgba(0,0,0,.28)';ctx.beginPath();ctx.ellipse(0,52,62-bob,9,0,0,7);ctx.fill();
  if(s.legend&&!sil){const g=ctx.createRadialGradient(0,-5,10,0,-5,95);g.addColorStop(0,'rgba(255,230,140,.55)');g.addColorStop(1,'rgba(255,230,140,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,-5,95,0,7);ctx.fill()}
  ctx.translate(0,bob);
  const e0=s.els[0], e1=s.els[s.els.length>2?2:s.els.length-1];
  // tail
  ctx.strokeStyle=C(s.body);ctx.lineWidth=14;ctx.lineCap='round';
  const tx=-88,ty=8+Math.sin(t*2)*6;
  ctx.beginPath();ctx.moveTo(-30,20);ctx.bezierCurveTo(-60,40,-70,0,tx,ty);ctx.stroke();
  ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-70,10);ctx.lineTo(tx,ty);ctx.stroke();
  if(!sil)feature(ctx,e0,tx-2,ty,1.1,t,-1.2);
  // back wing
  const wing=(dir,col,alpha)=>{ctx.save();ctx.translate(-4,-12);ctx.rotate(-.25+flap*dir);ctx.globalAlpha=alpha;
    ctx.fillStyle=C(col);ctx.strokeStyle=C(shade(s.body,-.35));ctx.lineWidth=2.5;
    ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(-10,-70,-62,-78);ctx.quadraticCurveTo(-50,-55,-58,-40);ctx.quadraticCurveTo(-40,-38,-44,-22);ctx.quadraticCurveTo(-24,-20,-22,-4);ctx.closePath();ctx.fill();ctx.stroke();
    if(s.els.includes('wind')&&!sil){ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=1.5;for(let i=0;i<4;i++){ctx.beginPath();ctx.moveTo(-8-i*6,-6-i*4);ctx.lineTo(-36-i*7,-60+i*9);ctx.stroke()}}
    ctx.restore()};
  wing(-1,shade(s.wing,-.25),1);
  // legs
  ctx.fillStyle=C(shade(s.body,-.2));
  for(const lx of[-22,18]){ctx.beginPath();ctx.roundRect(lx-7,28,14,22,6);ctx.fill()}
  // body
  ctx.fillStyle=C(s.body);ctx.beginPath();ctx.ellipse(0,14,46,32,0,0,7);ctx.fill();
  ctx.fillStyle=C(s.belly);ctx.beginPath();ctx.ellipse(8,24,28,18,-.1,0,7);ctx.fill();
  if(!sil){ctx.strokeStyle=shade(s.belly,-.15);ctx.lineWidth=1.5;for(let i=0;i<4;i++){ctx.beginPath();ctx.arc(8,24-12+i*8,22-i*2,.4,2.7);ctx.stroke()}}
  ctx.fillStyle=C(shade(s.body,-.12));for(const lx of[-12,26]){ctx.beginPath();ctx.roundRect(lx-7,32,14,20,6);ctx.fill()}
  // spine ornaments
  if(!sil){for(let i=0;i<3;i++){const a=Math.PI*1.15+i*.28;feature(ctx,e1,Math.cos(a)*44,14+Math.sin(a)*30,.55,t+i,a+Math.PI/2)}}
  // neck + head
  ctx.fillStyle=C(s.body);ctx.beginPath();ctx.moveTo(22,-8);ctx.quadraticCurveTo(40,-30,46,-40);ctx.lineTo(66,-28);ctx.quadraticCurveTo(52,-6,40,8);ctx.closePath();ctx.fill();
  const hx=58,hy=-44+Math.sin(t*2.2+1)*2;
  // horns
  ctx.fillStyle=C(s.horn);for(const [ox,len] of[[-10,26],[2,20]]){ctx.beginPath();ctx.moveTo(hx+ox-5,hy-12);ctx.quadraticCurveTo(hx+ox-14,hy-12-len,hx+ox-22,hy-14-len);ctx.quadraticCurveTo(hx+ox-6,hy-18,hx+ox+4,hy-12);ctx.fill()}
  if(!sil&&s.els.includes('bloom'))feature(ctx,'bloom',hx+4,hy-16,1,t,0);
  if(!sil&&s.els.includes('water'))feature(ctx,'water',hx-14,hy+2,.9,t,-2.2);
  ctx.fillStyle=C(s.body);ctx.beginPath();ctx.ellipse(hx,hy,24,19,0,0,7);ctx.fill();
  ctx.beginPath();ctx.ellipse(hx+22,hy+6,17,11,.15,0,7);ctx.fill();
  ctx.fillStyle=C(s.belly);ctx.beginPath();ctx.ellipse(hx+22,hy+11,13,5,.15,0,Math.PI);ctx.fill();
  if(!sil){
    ctx.fillStyle=shade(s.body,-.45);ctx.beginPath();ctx.arc(hx+33,hy+2,2,0,7);ctx.fill();
    // eye
    if(blink&&!reduce){ctx.strokeStyle='#1b1430';ctx.lineWidth=2.5;ctx.beginPath();ctx.moveTo(hx+2,hy-4);ctx.lineTo(hx+16,hy-4);ctx.stroke()}
    else{ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(hx+8,hy-5,8,9,0,0,7);ctx.fill();ctx.fillStyle='#1b1430';ctx.beginPath();ctx.ellipse(hx+10,hy-4,4.2,6,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(hx+11.5,hy-7,1.8,0,7);ctx.fill()}
    // cheek
    ctx.fillStyle='rgba(255,120,140,.35)';ctx.beginPath();ctx.ellipse(hx+2,hy+8,6,3.5,0,0,7);ctx.fill();
    // smile
    ctx.strokeStyle=shade(s.body,-.45);ctx.lineWidth=2;ctx.beginPath();ctx.arc(hx+24,hy+6,9,.3,1.3);ctx.stroke();
    if(s.els.includes('fire')&&Math.sin(t*1.3)>.85){feature(ctx,'fire',hx+44,hy+6,.8,t,1.57)}
  }
  // front wing
  wing(1,s.wing,sil?1:.92);
  if(s.legend&&!sil){ctx.strokeStyle='#ffe58a';ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(hx-4,hy-38,16,5,0,0,7);ctx.stroke()}
  ctx.restore();
}
function eggPath(ctx,w,h){ctx.beginPath();for(let a=0;a<=360;a+=4){const r=a*Math.PI/180,s=Math.sin(r);const x=Math.cos(r)*w*(1-.16*Math.max(0,-s)),y=s*h;a?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath()}
function drawEgg(ctx,sp,t,W,H,p=0,mystery=false){
  ctx.clearRect(0,0,W,H);ctx.save();const k=Math.min(W/90,H/105);ctx.translate(W/2,H/2+4*k);ctx.scale(k,k);
  const wob=p>.85&&!reduce?Math.sin(t*28)*.08:Math.sin(t*1.5)*.02;ctx.rotate(wob);
  const s=S[sp];const c1=mystery?'#6d5fa8':EL[s.els[0]].c1, c2=mystery?'#c8b6ff':(s.legend?'#ffe58a':EL[s.els[s.els.length-1]].c2);
  ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,42,26,6,0,0,7);ctx.fill();
  const g=ctx.createLinearGradient(0,-40,0,40);g.addColorStop(0,c2);g.addColorStop(1,c1);
  eggPath(ctx,30,40);ctx.fillStyle=s.legend&&!mystery?'#f5d76e':g;ctx.fill();
  ctx.save();eggPath(ctx,30,40);ctx.clip();
  const rnd=(i)=>{const x=Math.sin(i*91.7+sp.length*13.1)*43758.5;return x-Math.floor(x)};
  ctx.fillStyle=mystery?'rgba(255,255,255,.35)':shade(c1,-.25);
  for(let i=0;i<7;i++){ctx.beginPath();ctx.arc(rnd(i)*50-25,rnd(i+9)*64-34,3+rnd(i+3)*6,0,7);ctx.fill()}
  if(mystery){ctx.fillStyle='#fff';ctx.font='bold 30px Tajawal, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('؟',0,2)}
  ctx.restore();
  ctx.fillStyle='rgba(255,255,255,.55)';ctx.beginPath();ctx.ellipse(-11,-18,5,10,-.3,0,7);ctx.fill();
  if(p>.5){ctx.strokeStyle='#241a33';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(-14,-4);ctx.lineTo(-6,2);ctx.lineTo(-1,-6);ctx.lineTo(6,1);if(p>.8){ctx.lineTo(12,-6);ctx.lineTo(18,0)}ctx.stroke()}
  eggPath(ctx,30,40);ctx.strokeStyle='rgba(20,15,35,.6)';ctx.lineWidth=2.5;ctx.stroke();
  ctx.restore();
}
// canvas registry, one rAF loop
let cvs=[];
function mount(root){
  cvs=[];root.querySelectorAll('canvas[data-k]').forEach(c=>{
    const r=c.getBoundingClientRect(),dpr=Math.min(2,devicePixelRatio||1);
    c.width=Math.max(10,Math.round(r.width*dpr));c.height=Math.max(10,Math.round(r.height*dpr));
    cvs.push({c,ctx:c.getContext('2d'),k:c.dataset.k,sp:c.dataset.sp,sil:c.dataset.sil==='1',egg:c.dataset.egg,ph:Math.random()*6});
  });
  drawAll(performance.now()/1000);
}
function drawAll(t){for(const o of cvs){const T=reduce?1:t+o.ph;
  if(o.k==='d')drawDragon(o.ctx,o.sp,T,o.c.width,o.c.height,{sil:o.sil});
  else{let p=0;if(o.egg==='inc'){const i=+o.c.dataset.i;const e=state.eggs[i];if(e)p=1-left(e)/e.dur}
       drawEgg(o.ctx,o.sp,T,o.c.width,o.c.height,p,o.c.dataset.m==='1')}}}
function loop(){drawAll(performance.now()/1000);if(!reduce)requestAnimationFrame(loop)}

      <div class="hab-head"><div class="grow"><h3>مسكن ${EL[h.el].ar}</h3><span class="cap">${fmt(ds.length)} من ${fmt(h.cap)} · ${fmt(r)} ذهب في الدقيقة</span></div>
        ${h.cap<5?`<button class="btn ghost small" data-act="cap" data-h="${h.id}">توسيع <span class="price">${goldIco}${fmt(1000)}</span></button>`:''}</div>
      <div class="store">${goldIco}<div class="bar"><i data-store="${h.id}"></i></div><b data-storen="${h.id}">${fmt(h.stored)}</b>
        <button class="btn gold small" data-act="collect" data-h="${h.id}">اجمع</button></div>
      <div class="dragons">${ds.map(d=>`<button class="dtile" data-act="dragon" data-d="${d.id}"><canvas data-k="d" data-sp="${d.sp}"></canvas><span class="nm">${S[d.sp].name}</span><span class="lv">المستوى ${fmt(d.lvl)}</span></button>`).join('')}
        ${ds.length<h.cap?`<div class="slot-empty">مكان فارغ<br>فقّس بيضة ${EL[h.el].ar}</div>`:''}</div>
    </article>`}).join('')}
    <article class="card"><div class="vh"><h2 style="font-size:22px">ابنِ مسكنًا</h2></div>
      <p class="hint">كل تنين يسكن في مسكن عنصره. التنين الهجين يسكن في مسكن أيٍّ من عنصريه.</p>
      <div class="grid2">${E.map(e=>`<button class="btn ghost" data-act="build" data-el="${e}">مسكن ${EL[e].ar} <span class="price">${goldIco}${fmt(HAB_PRICE(e))}</span></button>`).join('')}</div>
    </article></section>`;
}
function farmCard(){const f=state.farm;return `<article class="card" style="background:linear-gradient(160deg,#284a22,var(--reef) 60%)">
  <div class="hab-head"><div class="grow"><h3>حقل التوت</h3><span class="cap">يعطيك ${fmt(FARM.yield)} طعام كل ${secs(FARM.dur)}</span></div></div>
  <div class="store">${foodIco}<div class="bar food"><i data-farm></i></div><span class="tm" data-farmt></span>
   ${f.state==='empty'?`<button class="btn small" data-act="plant">ازرع <span class="price">${goldIco}${fmt(FARM.cost)}</span></button>`:
     `<button class="btn small" data-act="harvest" data-farmb ${left(f)>0?'disabled':''}>احصد</button>`}</div></article>`}
function vNest(){
  return `<section class="view">
    <div class="vh"><h2>الحاضنة</h2><p>مكانان للبيض</p></div>
    ${state.pendingEgg?`<p class="card hint" style="color:var(--gold)">في الكهف بيضة جديدة تنتظر مكانًا في الحاضنة.</p>`:''}
    <div class="inc">${state.eggs.map((e,i)=>e?`<div class="incslot">
        <canvas data-k="e" data-egg="inc" data-i="${i}" data-sp="${e.sp}" data-m="${S[e.sp].els.length>1&&!state.seen[e.sp]?1:0}"></canvas>
        <div class="bar ember" style="width:100%"><i data-egg="${i}"></i></div><span class="tm" data-eggt="${i}"></span>
        <div class="row" style="justify-content:center" data-eggb="${i}"></div></div>`
      :`<div class="incslot"><span class="hint">المكان فارغ<br>اشترِ بيضة من السوق</span></div>`).join('')}</div>
    <div class="vh"><h2 style="font-size:22px">سوق البيض</h2><p>بيض العناصر الأساسية</p></div>
    <div class="grid2">${E.map(e=>`<div class="card egg-card"><canvas data-k="e" data-sp="${e}"></canvas><span class="nm">${S[e].name}</span>${elChips(e)}
      <span class="tm">يفقس في ${secs(S[e].hatch)}</span>
      <button class="btn small" data-act="buyegg" data-sp="${e}">اشترِ <span class="price">${goldIco}${fmt(EGG_PRICE[e])}</span></button></div>`).join('')}
      <div class="card egg-card" style="justify-content:center"><span class="nm">التنانين الهجينة</span><p class="hint">لا تُباع. زاوج تنينين من عنصرين مختلفين لتحصل عليها.</p><button class="btn ghost small" data-tab="breed">إلى التزاوج</button></div>
    </div></section>`;
}
let pick=[null,null];
function vBreed(){
  const b=state.breed;
  if(b){return `<section class="view"><div class="vh"><h2>كهف التزاوج</h2></div>
    <article class="card" style="align-items:center;text-align:center">
      <div class="pick" style="width:100%">${[b.a,b.b].map(sp=>`<div class="pickbox on"><canvas data-k="d" data-sp="${sp}"></canvas><b>${S[sp].name}</b></div>`).join('<span class="plus">+</span>')}</div>
      <canvas data-k="e" data-sp="${b.res}" data-m="1" style="width:90px;height:105px"></canvas>
      <div class="bar ember" style="width:100%"><i data-breed></i></div><span class="tm" data-breedt></span>
      <div class="row" data-breedb></div></article></section>`}
  const ok=state.dragons.filter(d=>d.lvl>=4);
  const P=i=>{const d=state.dragons.find(x=>x.id===pick[i]);return d?`<div class="pickbox on"><canvas data-k="d" data-sp="${d.sp}"></canvas><b>${S[d.sp].name}</b>${elChips(d.sp)}</div>`:`<div class="pickbox"><span class="hint">اختر تنينًا ${i?'ثانيًا':'أولًا'}</span></div>`};
  return `<section class="view"><div class="vh"><h2>كهف التزاوج</h2><p>${secs(BREED_DUR)}</p></div>
    <p class="hint">التنين يقدر يتزاوج من المستوى ٤. عنصر من كل أب يحدد نوع البيضة، ولو اجتمعت أربعة عناصر أو أكثر فقد يظهر بكّا الأسطوري.</p>
    <div class="pick">${P(0)}<span class="plus">+</span>${P(1)}</div>
    <button class="btn" data-act="breed" ${pick[0]&&pick[1]?'':'disabled'}>ابدأ التزاوج</button>
    <div class="list">${state.dragons.map(d=>{const can=d.lvl>=4;const sel=pick.includes(d.id);return `<button class="li ${sel?'sel':''} ${can?'':'locked'}" data-act="pick" data-d="${d.id}" ${can?'':'aria-disabled="true"'}>
      <canvas data-k="d" data-sp="${d.sp}"></canvas><span class="t"><b>${S[d.sp].name}</b><small>المستوى ${fmt(d.lvl)}${can?'':' · يحتاج المستوى ٤'}</small></span>${elChips(d.sp)}</button>`}).join('')}</div>
    ${ok.length<2?`<p class="hint">أطعم تنانينك من الجزيرة لترفع مستواها.</p>`:''}</section>`;
}
function vDex(){
  const n=ORDER.filter(k=>state.seen[k]).length;
  return `<section class="view"><div class="vh"><h2>الموسوعة</h2><p>${fmt(n)} من ${fmt(ORDER.length)}</p></div>
  <div class="dex">${ORDER.map(k=>{const s=S[k],seen=!!state.seen[k];const how=s.legend?'زاوج تنانين تجمع ٤ عناصر':s.els.length===1?'من سوق البيض':`زاوج ${EL[s.els[0]].ar} مع ${EL[s.els[1]].ar}`;
    return `<div class="dexc ${s.legend?'legend':''}"><canvas data-k="d" data-sp="${k}" data-sil="${seen?0:1}"></canvas><b>${seen?s.name:'؟؟؟'}</b>${seen?elChips(k):''}<span class="how">${how}</span>${seen?`<span class="how">${fmt(s.base)} ذهب/دقيقة لكل مستوى</span>`:''}</div>`}).join('')}</div></section>`;
}
function vSet(){
  return `<section class="view"><div class="vh"><h2>الإعدادات</h2></div>
  <article class="card light">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true"><circle cx="32" cy="32" r="14" fill="#ffe58a"/><g stroke="#ffcf4a" stroke-width="4" stroke-linecap="round">${[...Array(8)].map((_,i)=>{const a=i*Math.PI/4;return `<line x1="${32+Math.cos(a)*20}" y1="${32+Math.sin(a)*20}" x2="${32+Math.cos(a)*28}" y2="${32+Math.sin(a)*28}"/>`}).join('')}</g></svg>
    <h3>النور</h3><p>يضيف ١٠٠٠ جوهرة إلى رصيدك</p>
    <button class="btn gem" data-act="light">${gemIco} أضف ١٠٠٠ جوهرة</button>
  </article>
  <article class="card">
    <div class="setrow"><p>الأصوات<small>نغمات قصيرة عند الجمع والتفقيس</small></p><button class="switch" role="switch" aria-checked="${state.sound}" aria-label="الأصوات" data-act="sound"></button></div>
  </article>
  <article class="card">
    <div class="setrow"><p>تبديل الجواهر<small>١٠ جواهر = ١٠٠٠ ذهب · ٥ جواهر = ١٠٠ طعام</small></p></div>
    <div class="row"><button class="btn gold small" data-act="ex-gold">${gemIco}١٠ ← ١٠٠٠ ذهب</button><button class="btn ghost small" data-act="ex-food">${gemIco}٥ ← ١٠٠ طعام</button></div>
  </article>
  <article class="card">
    <div class="setrow"><p>بدء لعبة جديدة<small>يمسح التنانين والموارد المحفوظة على هذا الجهاز</small></p><button class="btn danger small" data-act="reset">${resetArm?'تأكيد المسح':'ابدأ من جديد'}</button></div>
  </article>
  <p class="hint" style="text-align:center">Dragon bka · لعبة أصلية · التقدّم محفوظ على هذا الجهاز</p></section>`;
}
let resetArm=false;
function render(){
  const v=$('#view');v.innerHTML={island:vIsland,nest:vNest,breed:vBreed,dex:vDex,set:vSet}[tab]();
  renderTabs();updateRes();tickUI();mount(document);
}

/* ---------- dragon sheet ---------- */
function openDragon(id){
  const d=state.dragons.find(x=>x.id===id);if(!d)return;const s=S[d.sp];const max=d.lvl>=MAX_LVL;
  $('#layer').innerHTML=`<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-label="${s.name}" dir="rtl" data-stop>
    <div class="row" style="justify-content:space-between"><h3>${s.name}</h3>${elChips(d.sp)}</div>
    <canvas class="big" data-k="d" data-sp="${d.sp}"></canvas>
    <div class="stats"><div class="stat"><small>المستوى</small><b>${fmt(d.lvl)}</b></div><div class="stat"><small>ذهب/دقيقة</small><b>${fmt(income(d))}</b></div><div class="stat"><small>التزاوج</small><b>${d.lvl>=4?'جاهز':'م٤'}</b></div></div>
    ${max?'<p class="hint">وصل أعلى مستوى.</p>':`<button class="btn" data-act="feed" data-d="${d.id}">أطعمه <span class="price">${foodIco}${fmt(feedCost(d))}</span></button>`}
    <button class="btn ghost small" data-act="release" data-d="${d.id}">${relArm===d.id?`تأكيد: أطلقه مقابل ${fmt(50*d.lvl)} ذهب`:'أطلقه إلى البرية'}</button>
    <button class="btn ghost" data-act="close">إغلاق</button></div></div>`;
  mount($('#layer'));sheetOpen=id;
}
let sheetOpen=null,relArm=null;
function closeSheet(){$('#layer').innerHTML='';sheetOpen=null;relArm=null;mount(document)}

/* ---------- actions ---------- */
function hatchPlace(sp){const h=state.habitats.find(h=>fits(sp,h)&&inHab(h).length<h.cap);return h}
const act={
  collect(el){const h=state.habitats.find(x=>x.id==el.dataset.h);const n=Math.floor(h.stored);if(n<1){toast('لا ذهب بعد');return}state.gold+=n;h.stored-=n;sfx.coin();bump('#r-gold');toast(`+${fmt(n)} ذهب`);commit()},
  cap(el){const h=state.habitats.find(x=>x.id==el.dataset.h);if(!pay('gold',1000))return;h.cap=5;sfx.up();toast('صار المسكن يتسع لخمسة');commit(true)},
  build(el){const e=el.dataset.el;if(!pay('gold',HAB_PRICE(e)))return;state.habitats.push({id:state.nextId++,el:e,cap:3,stored:0});sfx.up();toast(`بنيت مسكن ${EL[e].ar}`);commit(true)},
  plant(){if(!pay('gold',FARM.cost))return;state.farm={state:'growing',start:Date.now(),dur:FARM.dur};commit(true)},
  harvest(){if(left(state.farm)>0)return;state.food+=FARM.yield;state.farm={state:'empty'};sfx.coin();bump('#r-food');toast(`+${fmt(FARM.yield)} طعام`);commit(true)},
  buyegg(el){const sp=el.dataset.sp;const i=state.eggs.indexOf(null);if(i<0){sfx.no();toast('الحاضنة ممتلئة');return}if(!pay('gold',EGG_PRICE[sp]))return;
    state.eggs[i]={sp,start:Date.now(),dur:S[sp].hatch};sfx.coin();toast(`بيضة ${S[sp].name} في الحاضنة`);commit(true)},
  hatch(el){const i=+el.dataset.i;const e=state.eggs[i];if(!e||left(e)>0)return;const h=hatchPlace(e.sp);
    if(!h){sfx.no();toast(S[e.sp].legend?'ابنِ أي مسكن فيه مكان فارغ':`لا مكان. ابنِ أو وسّع مسكن ${S[e.sp].els.map(x=>EL[x].ar).join(' أو ')}`);return}
    const first=!state.seen[e.sp];state.dragons.push({id:state.nextId++,sp:e.sp,lvl:1,hab:h.id});state.seen[e.sp]=true;state.eggs[i]=null;
    if(state.pendingEgg){state.eggs[i]=state.pendingEgg;state.pendingEgg=null}
    sfx.hatch();toast(first?`نوع جديد في موسوعتك: ${S[e.sp].name}`:`فقس ${S[e.sp].name}`);commit(true)},
  skip(el){const t=el.dataset.t==='breed'?state.breed:el.dataset.t==='farm'?state.farm:state.eggs[+el.dataset.i];const c=skipCost(left(t));if(!pay('gems',c))return;t.start-=t.dur*1000;commit(true)},
  dragon(el){openDragon(+el.dataset.d)},
  feed(el){const d=state.dragons.find(x=>x.id==el.dataset.d);if(d.lvl>=MAX_LVL)return;if(!pay('food',feedCost(d)))return;d.lvl++;
    if(d.lvl===5||d.lvl===MAX_LVL){state.gems+=3;toast(`المستوى ${fmt(d.lvl)}! +٣ جواهر`)}else toast(`${S[d.sp].name} صار في المستوى ${fmt(d.lvl)}`);
    sfx.up();commit();openDragon(d.id)},
  release(el){const id=+el.dataset.d;if(relArm!==id){relArm=id;openDragon(id);relArm=id;return}
    const d=state.dragons.find(x=>x.id===id);state.gold+=50*d.lvl;state.dragons=state.dragons.filter(x=>x.id!==id);pick=pick.map(p=>p===id?null:p);closeSheet();toast('عاد التنين إلى البرية');commit(true)},
  close(){closeSheet()},
  pick(el){const id=+el.dataset.d;const d=state.dragons.find(x=>x.id===id);if(d.lvl<4){sfx.no();toast('يحتاج المستوى ٤');return}
    const j=pick.indexOf(id);if(j>=0)pick[j]=null;else if(!pick[0])pick[0]=id;else if(!pick[1])pick[1]=id;else pick[1]=id;render()},
  breed(){const [A,B]=pick.map(id=>state.dragons.find(x=>x.id===id));if(!A||!B)return;
    const ea=S[A.sp].els,eb=S[B.sp].els;const all=new Set([...ea,...eb]);
    let res=all.size>=4&&Math.random()<.12?'bka':spKey(ea[Math.floor(Math.random()*ea.length)],eb[Math.floor(Math.random()*eb.length)]);
    if(S[A.sp].legend||S[B.sp].legend){if(Math.random()<.3)res='bka'}
    state.breed={a:A.sp,b:B.sp,res,start:Date.now(),dur:res==='bka'?BREED_DUR*3:BREED_DUR};pick=[null,null];sfx.up();commit(true)},
  collectbreed(){const b=state.breed;if(!b||left(b)>0)return;const i=state.eggs.indexOf(null);const egg={sp:b.res,start:Date.now(),dur:S[b.res].hatch};
    if(i>=0){state.eggs[i]=egg;toast('البيضة الجديدة في الحاضنة')}else{state.pendingEgg=egg;toast('الحاضنة ممتلئة، البيضة تنتظر')}
    state.breed=null;sfx.hatch();commit(true)},
  light(){state.gems+=1000;sfx.light();bump('#r-gems');toast('النور: +١٠٠٠ جوهرة');commit()},
  sound(){state.sound=!state.sound;commit(true)},
  'ex-gold'(){if(!pay('gems',10))return;state.gold+=1000;sfx.coin();bump('#r-gold');commit()},
  'ex-food'(){if(!pay('gems',5))return;state.food+=100;sfx.coin();bump('#r-food');commit()},
  reset(){if(!resetArm){resetArm=true;render();setTimeout(()=>{if(resetArm){resetArm=false;if(tab==='set')render()}},4000);return}
    resetArm=false;pick=[null,null];state=fresh();save();toast('بدأت لعبة جديدة');setTab('island')},
};
function commit(rerender){save();updateRes();if(rerender)render();else tickUI()}
document.addEventListener('click',ev=>{
  const tb=ev.target.closest('[data-tab]');if(tb){setTab(tb.dataset.tab);return}
  const a=ev.target.closest('[data-act]');if(!a)return;
  if(a.dataset.act==='close'&&ev.target.closest('[data-stop]')&&a.classList.contains('scrim'))return;
  if(ac&&ac.state==='suspended')ac.resume();
  act[a.dataset.act]&&act[a.dataset.act](a);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&sheetOpen)closeSheet()});

/* ---------- time ---------- */
function simulate(){const now=Date.now();const dt=Math.max(0,(now-state.lastTick)/1000);state.lastTick=now;
  for(const h of state.habitats)h.stored=Math.min(habCap(h),h.stored+habRate(h)*dt)}
function tickUI(){
  for(const h of state.habitats){const b=document.querySelector(`[data-store="${h.id}"]`);if(b){b.style.width=Math.min(100,h.stored/habCap(h)*100)+'%';document.querySelector(`[data-storen="${h.id}"]`).textContent=fmt(h.stored)}}
  const f=state.farm,fb=document.querySelector('[data-farm]');
  if(fb){const l=f.state==='growing'?left(f):0;fb.style.width=f.state==='growing'?((1-l/f.dur)*100)+'%':'0%';
    document.querySelector('[data-farmt]').textContent=f.state==='empty'?'الحقل فارغ':l>0?secs(l):'جاهز';
    const hb=document.querySelector('[data-farmb]');if(hb)hb.disabled=l>0}
  state.eggs.forEach((e,i)=>{const b=document.querySelector(`[data-egg="${i}"]`);if(!b||!e)return;const l=left(e);b.style.width=((1-l/e.dur)*100)+'%';
    document.querySelector(`[data-eggt="${i}"]`).textContent=l>0?`يفقس بعد ${secs(l)}`:'جاهزة للتفقيس';
    const box=document.querySelector(`[data-eggb="${i}"]`);const want=l>0?`skip${skipCost(l)}`:'hatch';
    if(box.dataset.w!==want){box.dataset.w=want;box.innerHTML=l>0?`<button class="btn gem small" data-act="skip" data-i="${i}">${gemIco}${fmt(skipCost(l))} الآن</button>`:`<button class="btn small" data-act="hatch" data-i="${i}">فقّس</button>`}});
  const b=state.breed,bb=document.querySelector('[data-breed]');
  if(b&&bb){const l=left(b);bb.style.width=((1-l/b.dur)*100)+'%';document.querySelector('[data-breedt]').textContent=l>0?`تجهز البيضة بعد ${secs(l)}`:'البيضة جاهزة';
    const box=document.querySelector('[data-breedb]');const want=l>0?`s${skipCost(l)}`:'c';
    if(box.dataset.w!==want){box.dataset.w=want;box.innerHTML=l>0?`<button class="btn gem small" data-act="skip" data-t="breed">${gemIco}${fmt(skipCost(l))} الآن</button>`:`<button class="btn" data-act="collectbreed">خذ البيضة</button>`}}
}
let lastReady='';
function tick(){simulate();tickUI();
  const r=JSON.stringify([state.eggs.map(e=>e&&left(e)<=0),state.breed&&left(state.breed)<=0,state.farm.state==='growing'&&left(state.farm)<=0]);
  if(r!==lastReady){lastReady=r;renderTabs()}
  if(Date.now()%5000<1000)save()}

/* ---------- boot ---------- */
function start(data){
  state=(data&&data.state)||load()||fresh();
  const h=(location.hash||'').slice(1);if(TABS.some(t=>t[0]===h))tab=h;
  simulate();render();setInterval(tick,1000);if(!reduce)requestAnimationFrame(loop);
  window.addEventListener('resize',()=>mount(document));
  window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h!==tab&&TABS.some(t=>t[0]===h)){tab=h;render()}});
  if(hot&&hot.snapshot)hot.snapshot(()=>({state}));
}
if(hot&&hot.ready)hot.ready(start);else start(hot&&hot.data||{});
})();
</script>
